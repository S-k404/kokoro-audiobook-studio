name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The unit tests cover the converter and CLI helpers; they do not need
      # PyTorch or the Kokoro model, so those heavy dependencies are skipped.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest rich pymupdf ebooklib
          python -m pip install --no-deps -e .
      - name: Run tests
        run: python -m pytest -q
      - name: Check syntax of all modules
        run: python -m compileall -q audiobook_studio

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax check
        run: bash -n install.sh
